id: elt_pipeline
namespace: elt_pipeline


tasks:
  - id: hello
    type: io.kestra.plugin.core.log.Log
    message: Hello World! 🚀

  - id: create_gcp_bucket
    type: io.kestra.plugin.gcp.gcs.CreateBucket
    ifExists: SKIP
    storageClass: REGIONAL
    name: "{{kv('GCP_BUCKET_NAME')}}"

  - id: create_bq_dataset
    type: io.kestra.plugin.gcp.bigquery.CreateDataset
    name: "{{kv('GCP_DATASET')}}"
    ifExists: SKIP

  - id: push_to_git
    type: io.kestra.plugin.git.PushFlows
    branch: main
    commitMessage: Creating a gcp bucket and bigquery dataset for the project
    dryRun: false
    password: "{{secret('GITHUB_ACCESS_TOKEN')}}"
    username: "{{secret('USERNAME')}}"
    url: https://github.com/ianmuriuki01/kestra_basics
    gitDirectory: gcpResources



pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      location: "{{kv('GCP_LOCATION')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      serviceAccount: "{{secret('GCP')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"
      dataset: "{{kv('GCP_DATASET')}}"

