id: elt_main_pipeline
namespace: elt_pipeline


inputs:
  - id: taxi_color
    type: SELECT
    displayName: Select a color
    values: ["green", "yellow"]
    defaults: "green"
  
  - id: year
    type: SELECT
    displayName: Select Year
    values: ["2019", "2020", "2021"]
    defaults: "2021"

  - id: month
    type: SELECT
    displayName: Select Month
    values: ['01','02','03','04','05','06','07','08','09','10','11','12']
    defaults: '01'

variables:
  file: "{{inputs.taxi_color}}_tripdata_{{inputs.year}}-{{inputs.month}}.csv"
  gcs_file: "gs://{{kv('GCP_BUCKET_NAME')}}/{{render(vars.file)}}"
  table: "{{kv('GCP_DATASET')}}.{{inputs.taxi_color}}_tripdata_{{inputs.year}}-{{inputs.month}}"
  data: "{{outputs.extract_data.outputFiles[inputs.taxi_color ~ '_tripdata_' ~ inputs.year ~ '-' ~ inputs.month ~ '.csv']}}"


tasks:
  - id: hello
    type: io.kestra.plugin.core.log.Log
    message: Hello World! 🚀


  - id: extract_data
    type: io.kestra.plugin.scripts.shell.Commands
    outputFiles:
      - "*.csv"
    taskRunner:
      type: io.kestra.plugin.core.runner.Process
    commands:
      - curl -sL https://github.com/DataTalksClub/nyc-tlc-data/releases/download/{{inputs.taxi_color}}/{{render(vars.file)}}.gz | gzip -d > {{render(vars.file)}}

  - id: upload_to_gcs
    type: io.kestra.plugin.gcp.gcs.Upload
    to: "{{render(vars.gcs_file)}}"
    from: "{{render(vars.data)}}"

  - id: if_green
    type: io.kestra.plugin.core.flow.If
    condition: "{{inputs.taxi_color == 'green'}}"
    then:

      - id: create_bq_table_main
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: | 
          CREATE TABLE IF NOT EXISTS `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.greentripdata` (
              unique_row_id BYTES,
              filename STRING,
              VendorID INT64,
              lpep_pickup_datetime TIMESTAMP,
              lpep_dropoff_datetime TIMESTAMP,
              store_and_fwd_flag STRING,
              RatecodeID INT64,
              PULocationID INT64,
              DOLocationID INT64,
              passenger_count INT64,
              trip_distance FLOAT64,
              fare_amount FLOAT64,
              extra FLOAT64,
              mta_tax FLOAT64,
              tip_amount FLOAT64,
              tolls_amount FLOAT64,
              ehail_fee FLOAT64,
              improvement_surcharge FLOAT64,
              total_amount FLOAT64,
              payment_type INT64,
              trip_type INT64,
              congestion_surcharge FLOAT64
          )

          PARTITION BY DATE(lpep_pickup_datetime);

      - id: create_bq_table_ext
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE EXTERNAL TABLE `{{kv('GCP_PROJECT_ID')}}.{{render(vars.table)}}_ext` (
              VendorID INT64,
              lpep_pickup_datetime TIMESTAMP,
              lpep_dropoff_datetime TIMESTAMP,
              store_and_fwd_flag STRING,
              RatecodeID INT64,
              PULocationID INT64,
              DOLocationID INT64,
              passenger_count INT64,
              trip_distance FLOAT64,
              fare_amount FLOAT64,
              extra FLOAT64,
              mta_tax FLOAT64,
              tip_amount FLOAT64,
              tolls_amount FLOAT64,
              ehail_fee FLOAT64,
              improvement_surcharge FLOAT64,
              total_amount FLOAT64,
              payment_type INT64,
              trip_type INT64,
              congestion_surcharge FLOAT64          
          )
          OPTIONS (
            format = 'CSV',
            uris = ["{{render(vars.gcs_file)}}"],
            skip_leading_rows = 1,
            ignore_unknown_values = TRUE
          );

      - id: create_bq_table
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          CREATE OR REPLACE TABLE `{{kv('GCP_PROJECT_ID')}}.{{render(vars.table)}}` AS
            SELECT
              TO_HEX(MD5(CONCAT(
                COALESCE(CAST(VendorID as STRING), ""),
                COALESCE(CAST(fare_amount as STRING), ""),
                COALESCE(CAST(PULocationID as STRING), ""),
                COALESCE(CAST(DOLocationID as STRING), "")              
              ))) AS unique_row_id,
              "{{render(vars.file)}}" as filename,
              *
              FROM `{{kv('GCP_PROJECT_ID')}}.{{render(vars.table)}}_ext`;

      
      - id: merge_tables
        type: io.kestra.plugin.gcp.bigquery.Query
        sql: |
          MERGE INTO `{{kv('GCP_PROJECT_ID')}}.{{kv('GCP_DATASET')}}.greentripdata` S
          USING `{{kv('GCP_PROJECT_ID')}}.{{render(vars.table)}}` T
          ON S.unique_row_id = T.unique_row_id
          WHEN NOT MATCHED THEN
          INSERT
            (
              unique_row_id,
              filename,
              VendorID,
                  lpep_pickup_datetime,
                  lpep_dropoff_datetime,
                  store_and_fwd_flag,
                  RatecodeID,
                  PULocationID,
                  DOLocationID,
                  passenger_count,
                  trip_distance,
                  fare_amount,
                  extra,
                  mta_tax,
                  tip_amount,
                  tolls_amount,
                  ehail_fee,
                  improvement_surcharge,
                  total_amount,
                  payment_type,
                  trip_type,
                  congestion_surcharge
            )
          VALUES
            (
                      T.unique_row_id,
                      T.filename,
                      T.VendorID,
                      T.lpep_pickup_datetime,
                      T.lpep_dropoff_datetime,
                      T.store_and_fwd_flag,
                      T.RatecodeID,
                      T.PULocationID,
                      T.DOLocationID,
                      T.passenger_count,
                      T.trip_distance,
                      T.fare_amount,
                      T.extra,
                      T.mta_tax,
                      T.tip_amount,
                      T.tolls_amount,
                      T.ehail_fee,
                      T.improvement_surcharge,
                      T.total_amount,
                      T.payment_type,
                      T.trip_type,
                      T.congestion_surcharge
            )
    
  - id: push_to_git
    type: io.kestra.plugin.git.PushFlows
    branch: main
    commitMessage: Main Pipeline filtering based on color of taxi
    gitDirectory: main_elt_pipeline
    username: "{{secret('USERNAME')}}"
    password: "{{secret('GITHUB_ACCESS_TOKEN')}}"
    url: https://github.com/ianmuriuki01/kestra_basics

      





pluginDefaults:
  - type: io.kestra.plugin.gcp
    values:
      serviceAccount: "{{secret('GCP')}}"
      projectId: "{{kv('GCP_PROJECT_ID')}}"
      location: "{{kv('GCP_LOCATION')}}"
      bucket: "{{kv('GCP_BUCKET_NAME')}}"
      dataset: "{{kv('GCP_DATASET')}}"



